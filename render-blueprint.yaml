services:
  # -------------------------------------------------------------
  # InsightLoop Node.js TypeScript Backend API Service
  # -------------------------------------------------------------
  - name: insightloop-api
    type: web
    env: node
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @insightloop/shared build && pnpm --filter @insightloop/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 1
      - key: APP_TIME_ZONE
        value: Asia/Kolkata
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: WHATSAPP_ENABLED
        value: false
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: REHASH_PASSWORDS_ON_LOGIN
        value: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: AUTH_RATE_LIMIT_MAX_ATTEMPTS
        value: 10
      - key: STORAGE_DRIVER
        value: gridfs
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # -------------------------------------------------------------
  # InsightLoop React TypeScript Frontend (Static Site CDN)
  # -------------------------------------------------------------
  - name: insightloop-web
    type: web
    env: static
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @insightloop/shared build && pnpm --filter @insightloop/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://insightloop-api.onrender.com
      - key: VITE_WS_BASE_URL
        value: wss://insightloop-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
