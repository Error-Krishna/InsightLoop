services:
  - name: insightloop
    type: web
    env: python
    buildCommand: |
      pip install -r requirements.txt
      cd insightloop
      python manage.py collectstatic --noinput
    startCommand: |
      cd insightloop
      daphne -b 0.0.0.0 -p $PORT insightloop.asgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ${RENDER_EXTERNAL_HOSTNAME}
      - key: DISABLE_COLLECTSTATIC
        value: 0
      - key: RENDER_EXTERNAL_HOSTNAME
        value: ${RENDER_EXTERNAL_HOSTNAME}
      - key: PYTHONPATH
        value: /opt/render/project/src
      # The following must be set as real values in Render's dashboard
      # (Environment tab) -- they are NOT filled in here since they're
      # secrets / deployment-specific. See DEPLOYMENT.md for the full list
      # and where each value comes from.
      #   DJANGO_SECRET_KEY
      #   DJANGO_DEBUG=false
      #   DJANGO_ALLOWED_HOSTS         (include your Render hostname)
      #   FRONTEND_ORIGIN              (your Vercel frontend URL, e.g. https://your-app.vercel.app)
      #   DJANGO_CSRF_TRUSTED_ORIGINS  (include your Vercel frontend URL if you prefer the Django env var)
      #   DJANGO_CORS_ALLOWED_ORIGINS  (include your Vercel frontend URL if you prefer the Django env var)
      #   MONGODB_URI, MONGODB_DB_NAME
      #   REDIS_URL
      #   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
      #   WHATSAPP_* or OPENWA_* (whichever provider you're using)
      #   EMAIL_* (if using contact-form/notification email)
