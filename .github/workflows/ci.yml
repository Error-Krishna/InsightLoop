name: CI

on:
  push:
    branches: [main, migration/mern]
  pull_request:
    branches: [main, migration/mern]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit & Math Tests & Coverage
        run: |
          pnpm test
          pnpm --filter @insightloop/api run test:coverage
          node scripts/check_branch_coverage.mjs

      - name: Build Monorepo
        run: pnpm build

      - name: Seed Test Database
        env:
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
        run: python scripts/seed_test_db.py

      - name: Run Django Server (Background)
        env:
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
          DJANGO_SECRET_KEY: "ci-secret-key-must-be-long-enough-32-chars"
          REDIS_URL: ""
          DJANGO_DEBUG: "true"
          PYTHONPATH: "insightloop"
        run: |
          python -m daphne -b 127.0.0.1 -p 8000 insightloop.asgi:application &
          sleep 3

      - name: Run Node API Server (Background)
        env:
          NODE_ENV: test
          PORT: 4000
          HOST: 127.0.0.1
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
          JWT_SECRET: "ci-secret-key-must-be-long-enough-32-chars"
        run: |
          node apps/api/dist/server.js &
          sleep 3

      - name: Run Contract Parity Suite (Assert Mode)
        env:
          API_BASE_URL: "http://127.0.0.1:4000"
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
        run: node scripts/run_contract_suite.mjs --assert

      - name: Run Dual-Stack Cross-Compatibility Suite
        env:
          NODE_URL: "http://127.0.0.1:4000"
          DJANGO_URL: "http://127.0.0.1:8000"
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
        run: node scripts/test_dual_stack.mjs

      - name: Build Docker Containers
        run: |
          docker build -f apps/api/Dockerfile -t insightloop-api:ci .
          docker build -f apps/web/Dockerfile -t insightloop-web:ci .
