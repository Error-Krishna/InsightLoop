name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm (via Corepack)
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Architecture & Wiring Gates
        run: |
          node scripts/check_wiring.mjs
          node scripts/check_silent_errors.mjs

      - name: Citation & Symbol Verification
        run: node scripts/check_citations.mjs

      - name: Verify Python & Django Permanent Decommissioning
        run: node scripts/check_no_python.mjs

      - name: Unit & Math Tests & Coverage
        run: |
          pnpm test
          pnpm --filter @insightloop/api run test:coverage
          node scripts/check_branch_coverage.mjs

      - name: Offline Safety Nets (Schema, Snapshots, Negative Fixtures)
        run: |
          pnpm --filter @insightloop/api test test/schema_parity.test.ts
          pnpm --filter @insightloop/api test test/negative_fixtures.test.ts
          pnpm --filter @insightloop/api test test/snapshot_parity.test.ts
          pnpm --filter @insightloop/api test test/pdf_parity.test.ts

      - name: Build Monorepo
        run: pnpm build

      - name: Seed Test Database (Pure TypeScript)
        run: pnpm tsx scripts/seed.ts mongodb://localhost:27017/InsightLoop_test

      - name: Run Node API Server (Background)
        env:
          NODE_ENV: test
          PORT: 4000
          HOST: 127.0.0.1
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
          JWT_SECRET: "ci-secret-key-must-be-long-enough-32-chars"
        run: |
          node apps/api/dist/server.js &
          sleep 3

      - name: Run Contract Parity Suite (Assert Mode)
        env:
          API_BASE_URL: "http://127.0.0.1:4000"
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
        run: node scripts/run_contract_suite.mjs --assert

      - name: Deterministic Document Shape Check
        env:
          MONGODB_URI: "mongodb://localhost:27017/InsightLoop_test"
          MONGODB_DB_NAME: "InsightLoop_test"
        run: node scripts/check_doc_shape.mjs

      - name: Build Docker Containers
        run: |
          docker build -f apps/api/Dockerfile -t insightloop-api:ci .
          docker build -f apps/web/Dockerfile -t insightloop-web:ci .
